<!DOCTYPE html>
<html>
  <head>
    <meta charset="UTF-8" />
    <title>OpenCluely</title>
    <link href="./dist/output.css" rel="stylesheet" />
    <link href="./src/styles/common.css" rel="stylesheet" />
    <style>
      body {
        margin: 0;
        padding: 0;
        width: fit-content;
        height: fit-content;
        background: transparent;
        -webkit-app-region: no-drag;
      }

  .command-tab {
        height: 28px;
        background: linear-gradient(
          135deg,
          rgba(0, 0, 0, 0.4) 0%,
          rgba(20, 20, 20, 0.5) 100%
        );
        backdrop-filter: blur(20px);
        border-radius: 8px;
        display: flex;
        align-items: center;
        justify-content: center;
        gap: 16px;
        padding: 0 12px;
        color: rgba(255, 255, 255, 0.9);
        font-size: 11px;
        font-weight: 600;
        -webkit-app-region: drag;
        flex-wrap: nowrap;
        overflow: visible;
        border: 1px solid rgba(255, 255, 255, 0.15);
  width: 100%;
  /* Allow horizontal collapse to approximately one icon's width */
  min-width: 60px;
      }

      .command-item {
        display: flex;
        align-items: center;
        gap: 8px;
        padding: 6px 10px;
        border-radius: 6px;
        color: rgba(255, 255, 255, 0.9);
        font-size: 12px;
        cursor: pointer;
        transition: all 0.2s ease;
        -webkit-app-region: no-drag;
  /* Allow items to shrink so the bar can collapse to one icon width */
  flex-shrink: 1;
      }

      .command-item:hover {
        background: rgba(255, 255, 255, 0.1);
      }

      .command-item i {
        font-size: 14px;
        transition: all 0.3s ease;
      }

      .command-item span {
        color: rgba(255, 255, 255, 0.6);
        font-size: 11px;
      }

      .command-item.recording i {
        color: #ff4757;
        text-shadow: 0 0 10px rgba(255, 71, 87, 0.5);
        animation: pulse 2s infinite;
      }

      .command-item.interview-on {
        color: #4caf50;
      }
      .command-item.interview-on i {
        color: #4caf50;
        text-shadow: 0 0 10px rgba(76, 175, 80, 0.5);
      }

      .mode-label {
        font-size: 12px;
        font-weight: 600;
        color: rgba(255, 255, 255, 0.88);
        letter-spacing: 0.02em;
        -webkit-app-region: no-drag;
        flex-shrink: 0;
      }
      body.interview-hud .idle-only {
        display: none !important;
      }
      body.interview-hud .status-dot {
        background: #3ddc97;
        box-shadow: 0 0 8px rgba(61, 220, 151, 0.65);
        animation: pulse-green 1.4s infinite;
      }

      .command-item.active {
        color: #4caf50;
        text-shadow: 0 1px 2px rgba(76, 175, 80, 0.3);
      }

      .command-item.active:hover {
        background: rgba(76, 175, 80, 0.15);
        color: #4caf50;
      }

      .command-separator {
        width: 1px;
        height: 16px;
        background: linear-gradient(
          to bottom,
          transparent,
          rgba(255, 255, 255, 0.25),
          transparent
        );
        flex-shrink: 0;
      }

      .status-dot {
        width: 8px;
        height: 8px;
        border-radius: 50%;
        transition: all 0.3s ease;
        position: relative;
  flex-shrink: 0;
      }

      .status-dot.interactive,
      .status-dot.non-interactive {
        background: #8b8e93;
        box-shadow: none;
        animation: none;
      }

      .hidden-indicator {
        position: absolute;
        top: 50%;
        left: 50%;
        transform: translate(-50%, -50%);
        background: rgba(0, 0, 0, 0.8);
        color: rgba(255, 255, 255, 0.9);
        padding: 8px 16px;
        border-radius: 6px;
        font-size: 12px;
        font-weight: 500;
        opacity: 0;
        transition: opacity 0.3s ease;
        z-index: 1000;
      }

      .hidden-indicator.show {
        opacity: 1;
      }

      .command-item input,
      .command-item select {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.1) 0%, rgba(255, 255, 255, 0.05) 100%);
        border: 1px solid rgba(255, 255, 255, 0.2);
        border-radius: 4px;
        color: rgba(255, 255, 255, 0.95);
        font-size: 11px;
        font-weight: 600;
        outline: none;
        padding: 4px 8px;
        min-width: 65px;
        cursor: pointer;
        transition: all 0.2s ease;
        -webkit-app-region: no-drag;
        -webkit-appearance: none;
        -moz-appearance: none;
        appearance: none;
        background-image: url("data:image/svg+xml;charset=US-ASCII,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 4 5'><path fill='%23ffffff' d='M2 0L0 2h4zm0 5L0 3h4z'/></svg>");
        background-repeat: no-repeat;
        background-position: right 6px center;
        background-size: 8px 8px;
        padding-right: 20px;
      }

      .command-item select:hover {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.15) 0%, rgba(255, 255, 255, 0.08) 100%);
        border-color: rgba(255, 255, 255, 0.3);
        color: rgba(255, 255, 255, 1);
      }

      .command-item select:focus {
        background: linear-gradient(135deg, rgba(255, 255, 255, 0.2) 0%, rgba(255, 255, 255, 0.1) 100%);
        border-color: rgba(76, 175, 80, 0.6);
        box-shadow: 0 0 0 2px rgba(76, 175, 80, 0.2);
      }

      .command-item select option {
        background: rgba(30, 30, 30, 0.95);
        color: rgba(255, 255, 255, 0.9);
        padding: 4px 8px;
        font-weight: 500;
      }

      .command-item select option:checked {
        background: rgba(76, 175, 80, 0.8);
        color: white;
      }

      @keyframes pulse-green {
        0%, 100% { opacity: 1; transform: scale(1); }
        50% { opacity: 0.45; transform: scale(0.86); }
      }

      @keyframes pulse {
        0% {
          opacity: 1;
          transform: scale(1);
        }
        50% {
          opacity: 0.7;
          transform: scale(1.1);
        }
        100% {
          opacity: 1;
          transform: scale(1);
        }
      }

    </style>
  </head>
  <body>
    <div class="command-tab">
      <div class="status-dot non-interactive" id="statusDot"></div>
      <span class="mode-label" id="modeLabel">Idle</span>
      <div class="command-separator idle-only"></div>
      <div class="command-item idle-only" id="languageSelector" title="Coding language — type any">
        <input id="codingLanguage" list="codingLanguagePresets" value="java" placeholder="Java" spellcheck="false">
        <datalist id="codingLanguagePresets">
          <option value="java"></option>
          <option value="python"></option>
          <option value="cpp"></option>
          <option value="javascript"></option>
          <option value="typescript"></option>
          <option value="go"></option>
          <option value="rust"></option>
          <option value="kotlin"></option>
        </datalist>
      </div>
      <div class="command-separator"></div>
      <div class="command-item" id="screenshotButton" title="Screenshot (Ctrl+Shift+S)">
        <i class="fas fa-camera"></i>
      </div>
      <div class="command-separator"></div>
      <div class="command-item" id="interviewButton" title="Interview Mode (F8)">
        <span id="interviewHint">F8</span>
      </div>
    </div>

    <script src="./src/ui/main-window.js"></script>
  </body>
</html>
