<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Target Box</title>
  <link href="./dist/output.css" rel="stylesheet">
  <link href="./src/styles/common.css" rel="stylesheet">
  <style>
    body {
      background-color: transparent !important;
      margin: 0;
      padding: 0;
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }
    .box-container {
      width: 100%;
      height: 100%;
      border: 1px dashed rgba(255, 255, 255, 0.25);
      box-sizing: border-box;
      position: relative;
      background: rgba(255, 255, 255, 0.015);
      -webkit-app-region: drag;
    }
    .toolbar {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      background: rgba(15, 15, 15, 0.6);
      backdrop-filter: blur(16px);
      padding: 3px 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      -webkit-app-region: no-drag;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      height: 28px;
      box-sizing: border-box;
    }
    .btn {
      background: rgba(255, 255, 255, 0.06);
      color: rgba(255, 255, 255, 0.85);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 2px 8px;
      border-radius: 4px;
      cursor: pointer !important;
      font-size: 11px;
      transition: all 0.15s ease;
      display: inline-flex;
      align-items: center;
      gap: 4px;
    }
    .btn:hover {
      background: rgba(255, 255, 255, 0.15);
      color: #fff;
    }

    /* Neutral Segmented Switch for OCR / No OCR (No colors) */
    .segmented-switch {
      display: inline-flex;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.1);
      border-radius: 4px;
      padding: 1px;
      gap: 1px;
    }
    .switch-option {
      padding: 2px 7px;
      font-size: 10px;
      color: rgba(255, 255, 255, 0.5);
      border-radius: 3px;
      cursor: pointer !important;
      user-select: none;
      transition: all 0.15s ease;
    }
    .switch-option.active {
      background: rgba(255, 255, 255, 0.2);
      color: rgba(255, 255, 255, 0.95);
      font-weight: 600;
    }

    .toolbar-left {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .toolbar-right {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    .close-btn {
      background: rgba(255, 255, 255, 0.05);
      color: rgba(255, 255, 255, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 4px;
      width: 20px;
      height: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer !important;
      font-size: 10px;
      transition: all 0.15s ease;
    }
    .close-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      color: #fff;
    }
  </style>
</head>
<body>
  <div class="box-container">
    <div class="toolbar">
      <div class="toolbar-left">
        <button class="btn" id="extractBtn"><i class="fas fa-bolt"></i> Extract</button>
      </div>
      <div class="toolbar-right">
        <div class="segmented-switch">
          <div class="switch-option active" id="ocrModeBtn" title="Apple Vision OCR">OCR</div>
          <div class="switch-option" id="axModeBtn" title="Accessibility API">No OCR</div>
        </div>
        <button class="close-btn" id="closeBtn"><i class="fas fa-times"></i></button>
      </div>
    </div>
  </div>
  <script src="./src/ui/target-box.js"></script>
</body>
</html>
