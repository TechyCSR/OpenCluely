<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>OpenCluely</title>
    <script src="lib/markdown.js"></script>
    <script src="lib/mathrender.js"></script>
    <style>
        .text-white { color: white; }
        .text-gray-300 { color: #d1d5db; }
        .text-sm { font-size: 0.875rem; }
        .font-medium { font-weight: 500; }
        .mr-2 { margin-right: 0.5rem; }

        body {
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.4) 0%, rgba(20, 20, 20, 0.5) 100%);;
            -webkit-app-region: no-drag;
            color: white;
            margin: 0;
            padding: 0;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
        }
        .content-area {
            -webkit-app-region: no-drag;
        }
        .markdown-content {
            line-height: 1.6;
            color: white;
            font-size: 0.875rem;
        }
        .markdown-content h1, .markdown-content h2, .markdown-content h3 {
            margin-top: 1.2rem;
            margin-bottom: 0.8rem;
            font-weight: bold;
            color: white;
        }
        .markdown-content h1 { font-size: 1.2rem; }
        .markdown-content h2 { font-size: 1.1rem; }
        .markdown-content h3 { font-size: 1rem; }
        .markdown-content p { margin-bottom: 0.8rem; color: white; font-size: 0.875rem; }
        .markdown-content ul, .markdown-content ol { margin-bottom: 0.8rem; padding-left: 1.2rem; font-size: 0.875rem; }
        .markdown-content li { margin-bottom: 0.4rem; color: white; font-size: 0.875rem; }
        .markdown-content code { 
            background-color: rgba(0, 0, 0, 0.4); 
            padding: 0.2rem 0.4rem; 
            border-radius: 0.25rem; 
            font-family: 'Courier New', monospace;
            color: #e5e7eb;
        }
        .markdown-content pre { 
            background-color: rgba(0, 0, 0, 0.4); 
            padding: 1rem; 
            border-radius: 0.5rem; 
            margin: 1rem 0;
            overflow-x: auto;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .markdown-content pre code { 
            background-color: transparent; 
            padding: 0; 
            color: #e5e7eb;
        }
        .markdown-content blockquote {
            border-left: 4px solid #6b7280;
            padding-left: 1rem;
            margin: 1rem 0;
            font-style: italic;
            color: #d1d5db;
        }
        .math {
            font-family: 'Cambria Math', 'STIX Two Math', 'Latin Modern Math', Georgia, serif;
            white-space: nowrap;
        }
        .markdown-content sup, .markdown-content sub {
            font-size: 0.72em;
            line-height: 0;
        }

        /* Main container - ensures full viewport usage */
        .main-container {
            height: 100vh;
            width: 100vw;
            overflow: hidden;
            position: relative;
            background: transparent;
        }

        /* Split layout is retired. Coding answers stay in one stacked card. */
        .split-layout,
        #split-layout {
            display: none !important;
        }

        /* Panel improvements with proper scrolling */
        .text-panel, .code-panel {
            background: transparent;
            overflow: hidden;
            position: relative;
            min-height: 0; /* Important for grid items */
        }

        .panel-content {
            height: 100%;
            overflow-y: auto;
            overflow-x: auto;
            padding: 1rem;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        /* Full content layout */
        .full-content {
            height: 100vh;
            padding: 0;
            box-sizing: border-box;
            overflow: hidden;
            position: relative;
        }

        .full-content-inner {
            height: 100%;
            background-color: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            border-radius: 0.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
            overflow-y: auto;
            overflow-x: auto;
            padding: 1rem;
            box-sizing: border-box;
            scroll-behavior: smooth;
        }

        /* Hide scrollbars completely while maintaining scrollability */
        .panel-content::-webkit-scrollbar, 
        .full-content-inner::-webkit-scrollbar {
            width: 0px;
            height: 0px;
            display: none;
        }
        
        /* For Firefox and other browsers */
        .panel-content, 
        .full-content-inner {
            scrollbar-width: none;
            -ms-overflow-style: none;
        }

        /* Code block styling */
        .code-block {
            background-color: rgba(0, 0, 0, 0.3); 
            margin-bottom: 1rem;
            border-radius: 0.5rem;
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .code-header {
            background-color: rgba(0, 0, 0, 0.4);
            padding: 0.5rem 0.75rem;
            border-radius: 0.5rem 0.5rem 0 0;
            font-family: 'Courier New', monospace;
            font-size: 0.75rem;
            color: #d1d5db;
            font-weight: bold;
        }
        .code-content {
            padding: 1rem;
            overflow-x: auto;
            background-color: rgba(0, 0, 0, 0.2);
            border-radius: 0 0 0.5rem 0.5rem;
        }
        .code-content pre {
            background-color: transparent;
            border: none;
            margin: 0;
            padding: 0;
        }
        .code-content code {
            background-color: transparent;
            color: #e5e7eb;
        }
        .no-code {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: #9ca3af;
            font-style: italic;
        }

        /* Loading state */
        .loading {
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            background-color: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(8px);
        }
        
        .loading-compact {
            display: flex;
            align-items: center;
            justify-content: center;
            width: 200px;
            height: 60px;
            background: transparent;
        }
        
        .dots-container {
            display: inline-flex;
            align-items: center;
            gap: 0.3rem;
        }
        
        .bouncing-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #4CAF50;
            animation: bounce 1.4s infinite ease-in-out;
        }
        
        .bouncing-dot:nth-child(1) { animation-delay: -0.32s; }
        .bouncing-dot:nth-child(2) { animation-delay: -0.16s; }
        .bouncing-dot:nth-child(3) { animation-delay: 0s; }
        
        @keyframes bounce {
            0%, 80%, 100% {
                transform: scale(0);
                opacity: 0.5;
            }
            40% {
                transform: scale(1);
                opacity: 1;
            }
        }

        /* Interactive scrolling enhancements */
        .interactive-scrolling .panel-content,
        .interactive-scrolling .full-content-inner {
            cursor: grab;
        }

        .interactive-scrolling .panel-content:active,
        .interactive-scrolling .full-content-inner:active {
            cursor: grabbing;
        }

        /* Remove hover effects for clean content appearance */

        /* Override Prism theme for better visibility */
        .token.comment,
        .token.prolog,
        .token.doctype,
        .token.cdata {
            color: #6a737d;
        }
        
        .token.punctuation {
            color: #e1e4e8;
        }
        
        .token.property,
        .token.tag,
        .token.boolean,
        .token.number,
        .token.constant,
        .token.symbol,
        .token.deleted {
            color: #79b8ff;
        }
        
        .token.selector,
        .token.attr-name,
        .token.string,
        .token.char,
        .token.builtin,
        .token.inserted {
            color: #85e89d;
        }
        
        .token.operator,
        .token.entity,
        .token.url,
        .language-css .token.string,
        .style .token.string {
            color: #f97583;
        }
        
        .token.atrule,
        .token.attr-value,
        .token.keyword {
            color: #f97583;
        }
        
        .token.function,
        .token.class-name {
            color: #b392f0;
        }
        
        .token.regex,
        .token.important,
        .token.variable {
            color: #ffab70;
        }
        
        .token.important,
        .token.bold {
            font-weight: bold;
        }
        
        .token.italic {
            font-style: italic;
        }
        
        .token.entity {
            cursor: help;
        }

        /* Ensure content is always visible */
        .hidden { display: none !important; }
        .visible { display: block !important; }

        /* Draggable header bar */
        .window-header {
            position: absolute;
            top: 0;
            left: 0;
            right: 0;
            height: 32px;
            -webkit-app-region: drag;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 10px;
            box-sizing: border-box;
            background: linear-gradient(180deg, rgba(255,255,255,0.10) 0%, rgba(255,255,255,0.04) 100%);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid rgba(255,255,255,0.12);
            z-index: 50;
            color: #e5e7eb;
            font-size: 12px;
            letter-spacing: 0.3px;
        }
        .window-title {
            pointer-events: none;
            user-select: none;
            opacity: 0.9;
        }
        .window-controls {
            display: flex;
            gap: 6px;
            -webkit-app-region: no-drag;
        }
        .window-btn {
            width: 22px;
            height: 22px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            border-radius: 4px;
            background: rgba(255,255,255,0.06);
            color: #e5e7eb;
            border: 1px solid rgba(255,255,255,0.12);
            cursor: pointer;
            transition: background 0.15s ease, color 0.15s ease, border-color 0.15s ease;
            font-weight: 600;
            line-height: 1;
        }
        .window-btn:hover {
            background: rgba(255,255,255,0.12);
            border-color: rgba(255,255,255,0.2);
        }
        .window-btn-close:hover {
            background: rgba(239, 68, 68, 0.25);
            border-color: rgba(239, 68, 68, 0.45);
            color: #fff;
        }
        
        /* Push content below header */
        .has-header #response-content,
        .has-header #loading {
            margin-top: 32px;
        }
        .has-header .split-layout,
        .has-header .full-content,
        .has-header .loading {
            height: calc(100vh - 32px);
        }

        .copy-btn { 
            position: absolute; 
            top: 6px; 
            right: 6px; 
            background: rgba(0,0,0,0.5); 
            color: rgba(255,255,255,0.9); 
            border: 1px solid rgba(255,255,255,0.2); 
            padding: 4px 8px; 
            font-size: 11px; 
            border-radius: 4px; 
            cursor: pointer; 
            -webkit-app-region: no-drag; 
            transition: background 0.2s ease, border-color 0.2s ease, transform 0.12s ease;
        }
        .copy-btn:hover { background: rgba(0,0,0,0.7); }
        .copy-btn.copied { 
            background: rgba(76,175,80,0.85); 
            border-color: rgba(76,175,80,0.95); 
            transform: scale(0.98);
        }

        body.interview-card {
            background: transparent;
        }
        body.interview-card .window-header {
            display: none !important;
        }
        body.interview-card.has-header #response-content,
        body.interview-card.has-header #loading {
            margin-top: 0;
        }
        body.interview-card .split-layout,
        body.interview-card .full-content,
        body.interview-card .loading {
            height: 100vh;
        }
        body.interview-card #split-layout {
            display: none !important;
        }
        body.interview-card .loading {
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.92) 0%, rgba(8, 8, 8, 0.96) 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            backdrop-filter: blur(20px);
        }
        body.interview-card .full-content-inner {
            background: linear-gradient(135deg, rgba(0, 0, 0, 0.92) 0%, rgba(8, 8, 8, 0.96) 100%);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 12px;
            backdrop-filter: blur(20px);
        }
        body.interview-card .text-panel,
        body.interview-card .code-panel {
            background: transparent;
            border: none;
            border-radius: 0;
        }
        body.interview-card .full-content-inner,
        body.interview-card .panel-content,
        body.interview-card .loading {
            padding: 36px 18px 16px 18px;
        }
        body.interview-card .markdown-content {
            font-size: 1.05rem;
            line-height: 1.6;
        }
        body.interview-card .markdown-content p {
            margin-bottom: 0.75rem;
            font-size: 1.05rem;
        }
        body.interview-card .markdown-content li {
            font-size: 1.05rem;
        }
        body.interview-card .markdown-content h1 { font-size: 1.35rem; }
        body.interview-card .markdown-content h2 { font-size: 1.22rem; }
        body.interview-card .markdown-content h3 { font-size: 1.12rem; }
        body.interview-card .markdown-content code,
        body.interview-card .markdown-content pre code {
            font-size: 0.98rem;
        }

        .asked-question {
            margin: 0 0 14px 0;
            padding: 0 0 12px 0;
            border-bottom: 1px solid rgba(255, 255, 255, 0.16);
        }
        .asked-label {
            font-size: 11px;
            font-weight: 700;
            letter-spacing: 0.08em;
            text-transform: uppercase;
            color: #d0d0d0;
        }
        .asked-question p,
        #question-text,
        #loading-question-text {
            margin: 6px 0 0 0;
            color: #ffffff;
            font-size: 1.02rem;
            font-weight: 650;
            line-height: 1.45;
            white-space: pre-wrap;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.55);
        }
        body.interview-card .asked-question p,
        body.interview-card #question-text,
        body.interview-card #loading-question-text {
            font-size: 1.06rem;
            color: #ffffff;
        }
        body.interview-card .markdown-content,
        body.interview-card .markdown-content p,
        body.interview-card .markdown-content li {
            color: #f5f5f5;
        }
        body.interview-card .markdown-content pre {
            background: rgba(0, 0, 0, 0.62);
            border: 1px solid rgba(255, 255, 255, 0.12);
            padding: 14px 16px;
            margin: 12px 0 4px 0;
            overflow-x: auto;
            overflow-y: visible;
            max-height: none;
        }
        body.interview-card .markdown-content pre code {
            color: #f3f3f3;
            font-size: 0.96rem;
            line-height: 1.5;
            white-space: pre;
        }
        .history-nav {
            position: absolute;
            top: 8px;
            right: 10px;
            z-index: 80;
            display: flex;
            align-items: center;
            gap: 6px;
            padding: 3px 6px;
            border-radius: 8px;
            background: rgba(0, 0, 0, 0.62);
            border: 1px solid rgba(255, 255, 255, 0.16);
            -webkit-app-region: no-drag;
        }
        .history-nav.hidden { display: none !important; }
        .history-nav button {
            width: 28px;
            height: 26px;
            border-radius: 6px;
            border: 1px solid rgba(255, 255, 255, 0.18);
            background: rgba(255,255,255,0.06);
            color: #fff;
            font-size: 16px;
            line-height: 1;
            cursor: pointer;
        }
        .history-nav button:disabled {
            opacity: 0.35;
            cursor: default;
        }
        .history-nav button:not(:disabled):hover {
            background: rgba(255, 255, 255, 0.12);
        }
        .history-pos {
            min-width: 36px;
            text-align: center;
            font-size: 11px;
            font-weight: 700;
            color: #f0f0f0;
        }
        body.interview-card .loading {
            flex-direction: column;
            align-items: stretch;
            justify-content: flex-start;
            padding: 36px 18px 16px 18px;
        }
        body.interview-card .loading .asked-question {
            margin-bottom: 16px;
        }
        body.interview-card .loading-compact {
            width: auto;
            height: auto;
            justify-content: flex-start;
        }
    </style>
</head>
<body class="text-white">
    <div class="main-container has-header">
        <div id="history-nav" class="history-nav hidden">
            <button id="history-prev" type="button" title="Previous answer (Alt+Left)">‹</button>
            <span id="history-pos">1/1</span>
            <button id="history-next" type="button" title="Next answer (Alt+Right)">›</button>
        </div>
        <!-- Draggable Header -->
        <div class="window-header">
            <div class="window-title">AI Response</div>
            <div class="window-controls">
                <button id="close-window-btn" class="window-btn window-btn-close" title="Close">×</button>
            </div>
        </div>

        <!-- Loading State -->
        <div id="loading" class="loading">
            <div id="loading-question-block" class="asked-question hidden">
                <div class="asked-label">Question</div>
                <div id="loading-question-text"></div>
            </div>
            <div class="loading-compact">
                <span class="text-gray-300 text-sm font-medium mr-2">Analyzing</span>
                <div class="dots-container">
                    <div class="bouncing-dot"></div>
                    <div class="bouncing-dot"></div>
                    <div class="bouncing-dot"></div>
                </div>
            </div>
        </div>

        <!-- Response Content -->
        <div id="response-content" class="content-area hidden">
            <!-- Split Layout -->
            <div id="split-layout" class="split-layout hidden">
                <!-- Text Panel -->
                <div class="text-panel">
                    <div class="panel-content" tabindex="0">
                        <div id="text-content" class="markdown-content"></div>
                    </div>
                </div>

                <!-- Code Panel -->
                <div class="code-panel">
                    <div class="panel-content" tabindex="0">
                        <div id="code-content"></div>
                    </div>
                </div>
            </div>

            <!-- Full Content (when no code detected) -->
            <div id="full-content" class="full-content hidden">
                <div class="full-content-inner" tabindex="0">
                    <div id="full-markdown" class="markdown-content"></div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Global variables
        let currentLayout = 'split';
        let liveStreamBuffer = '';
        let hasCode = false;
        let isInteractive = false;
        let scrollableElements = [];
        let initialized = false;
        let interviewHud = false;
        let compactCard = false;
        let answerCardFrozen = false;
        let liveStreamActive = false;
        let interviewResizeTimer = null;
        let currentQuestion = '';
        let currentResponse = '';
        let liveQuestion = '';
        const MAX_TURN_HISTORY = 25;
        let turnHistory = [];
        let historyIndex = -1;
        let viewingHistory = false;

        function ipcData(args) {
            if (!args || args.length === 0) return null;
            if (args.length >= 2 && args[1] !== undefined) return args[1];
            return args[0];
        }
        
        // Immediate logging to verify script execution
        console.log('[LLM-RESPONSE] Script tag executed');
        
        window.onerror = function(msg, url, line, col, error) {
            console.error('[LLM-RESPONSE] Window error:', msg, 'at line', line);
            return false;
        };
        
        document.addEventListener('DOMContentLoaded', function() {
            console.log('[LLM-RESPONSE] DOMContentLoaded fired');
            initLLMResponseWindow();
        });
        
        // Also try immediate init in case DOMContentLoaded already fired
        if (document.readyState === 'complete' || document.readyState === 'interactive') {
            console.log('[LLM-RESPONSE] Document already ready, initializing now');
            setTimeout(initLLMResponseWindow, 0);
        }
        
        function initLLMResponseWindow() {
            if (initialized) return;
            initialized = true;
            
            console.log('[LLM-RESPONSE] Initializing window...');

            // Prefer marked when available, but fall back to the bundled markdown.js parser.
            if (typeof marked !== 'undefined') {
                marked.setOptions({
                    highlight: function(code, lang) {
                        if (typeof Prism !== 'undefined' && Prism.languages[lang]) {
                            return Prism.highlight(code, Prism.languages[lang], lang);
                        }
                        return code;
                    },
                    breaks: true,
                    gfm: true
                });
                console.log('[LLM-RESPONSE] marked configured');
            } else if (typeof markdown !== 'undefined' && typeof markdown.toHTML === 'function') {
                console.log('[LLM-RESPONSE] using bundled markdown.js renderer');
            } else {
                console.error('[LLM-RESPONSE] no markdown renderer available, falling back to plain text');
            }

            console.log('[LLM-RESPONSE] electronAPI exists:', !!window.electronAPI);
            console.log('[LLM-RESPONSE] onDisplayLlmResponse method:', typeof window.electronAPI?.onDisplayLlmResponse);
            
            // Set up event listeners using electronAPI from preload script
            if (window.electronAPI) {
                console.log('[LLM-RESPONSE] Setting up IPC listeners...');
                
                // Set up show-loading event listener
                window.electronAPI.onShowLoading((...args) => {
                    const data = ipcData(args) || (args.length >= 2 ? args[1] : args[0]);
                    if (data && data.compact) {
                        compactCard = true;
                        setInterviewHud(true);
                    }
                    snapshotCurrentTurn();
                    unfreezeAnswerCard();
                    liveStreamActive = true;
                    currentResponse = '';
                    liveStreamBuffer = '';
                    viewingHistory = false;
                    liveQuestion = (data && data.question) || '';
                    setAskedQuestion(liveQuestion);
                    console.log('[LLM-RESPONSE] show-loading received');
                    showLoadingState();
                    updateHistoryNav();
                });
                if (window.electronAPI.onInterviewHud) {
                    window.electronAPI.onInterviewHud(function () {
                        applyInterviewHudPayload(ipcData(arguments), { clearHistory: true });
                    });
                }
                if (window.electronAPI.onInterviewHistoryNav) {
                    window.electronAPI.onInterviewHistoryNav(function () {
                        const payload = ipcData(arguments);
                        navigateHistory(payload && payload.direction === 'next' ? 1 : -1);
                    });
                }
                if (window.electronAPI.onInterviewUpdate) {
                    window.electronAPI.onInterviewUpdate(function () {
                        // Caption updates must never wipe answer history if the
                        // payload is missing/malformed. Only apply a real boolean.
                        applyInterviewHudPayload(ipcData(arguments), { clearHistory: false });
                    });
                }
                if (window.electronAPI.onInteractionModeChanged) {
                    window.electronAPI.onInteractionModeChanged(function () {
                        const data = ipcData(arguments);
                        isInteractive = !!(data === true || (data && data.interactive));
                    });
                }
                if (window.electronAPI.getInterviewState) {
                    window.electronAPI.getInterviewState().then((state) => {
                        applyInterviewHudPayload(state, { clearHistory: false });
                    }).catch(() => {});
                }
                
                // Listen for LLM response
                window.electronAPI.onDisplayLlmResponse(function() {
                    console.log('[LLM-RESPONSE] ===== display-llm-response received! =====');
                    console.log('[LLM-RESPONSE] arguments count:', arguments.length);
                    
                    try {
                        // Get the data - could be first or second argument
                        let actualData = null;
                        if (arguments.length >= 2 && arguments[1] && typeof arguments[1] === 'object') {
                            actualData = arguments[1];
                        } else if (arguments.length >= 1 && arguments[0] && typeof arguments[0] === 'object') {
                            actualData = arguments[0];
                        }
                        
                        console.log('[LLM-RESPONSE] actualData keys:', actualData ? Object.keys(actualData) : 'null');
                        
                        const response = actualData?.content || actualData?.response;
                        console.log('[LLM-RESPONSE] response found:', !!response, 'length:', response?.length);
                        
                        if (!response) {
                            console.error('[LLM-RESPONSE] No response content found!');
                            hideLoadingState();
                            return;
                        }

                        if (actualData.metadata && actualData.metadata.compactCard) {
                            compactCard = true;
                            setInterviewHud(true);
                        }
                        setAskedQuestion(
                            actualData.question
                            || (actualData.metadata && actualData.metadata.question)
                        );
                        liveStreamActive = false;
                        if (viewingHistory || answerCardFrozen) {
                            if (useSingleColumn()) {
                                rememberTurn(
                                    currentQuestion,
                                    actualData.content || actualData.response
                                );
                            }
                            updateHistoryNav();
                            return;
                        }
                        hideLoadingState();
                        displayResponse(actualData);
                        setupScrolling();
                        setTimeout(verifyDisplayState, 500);
                        console.log('[LLM-RESPONSE] Handler completed successfully');
                    } catch (err) {
                        console.error('[LLM-RESPONSE] Error in handler:', err.message, err.stack);
                        hideLoadingState();
                    }
                });
                
                if (window.electronAPI.onTranscriptionLlmResponseStart) {
                    window.electronAPI.onTranscriptionLlmResponseStart(function () {
                        const data = ipcData(arguments);
                        snapshotCurrentTurn();
                        unfreezeAnswerCard();
                        liveStreamActive = true;
                        currentResponse = '';
                        liveStreamBuffer = '';
                        viewingHistory = false;
                        liveQuestion = (data && data.question) || liveQuestion;
                        setAskedQuestion(liveQuestion);
                        updateHistoryNav();
                        if (useSingleColumn()) {
                            showLoadingState();
                            return;
                        }
                        hideLoadingState();
                        const responseElement = document.getElementById('response-content');
                        if (responseElement) responseElement.classList.remove('hidden');
                        displayFullLayout('');
                    });
                }
                if (window.electronAPI.onTranscriptionLlmResponseChunk) {
                    window.electronAPI.onTranscriptionLlmResponseChunk(function () {
                        const data = ipcData(arguments);
                        const delta = (data && data.delta) || '';
                        if (!delta) return;
                        liveStreamBuffer += delta;
                        if (useSingleColumn()) {
                            rememberTurn(liveQuestion || currentQuestion, liveStreamBuffer);
                        }
                        if (viewingHistory || answerCardFrozen) return;
                        hideLoadingState();
                        const responseElement = document.getElementById('response-content');
                        if (responseElement) responseElement.classList.remove('hidden');
                        renderLiveStream(liveStreamBuffer);
                    });
                }
                if (window.electronAPI.onTranscriptionLlmResponse) {
                    window.electronAPI.onTranscriptionLlmResponse(function () {
                        const data = ipcData(arguments);
                        const response = (data && (data.response || data.content)) || liveStreamBuffer;
                        if (!response) return;
                        if (data && data.question) {
                            liveQuestion = data.question;
                            setAskedQuestion(liveQuestion);
                        }
                        currentResponse = response;
                        liveStreamBuffer = response;
                        if (useSingleColumn()) {
                            rememberTurn(liveQuestion || currentQuestion, response);
                        }
                        liveStreamActive = false;
                        if (viewingHistory || answerCardFrozen) {
                            updateHistoryNav();
                            return;
                        }
                        hideLoadingState();
                        const responseElement = document.getElementById('response-content');
                        if (responseElement) responseElement.classList.remove('hidden');
                        renderAnswer(response);
                        if (useSingleColumn()) {
                            requestInterviewResize({ freeze: true });
                        }
                        updateHistoryNav();
                    });
                }

                const prevBtn = document.getElementById('history-prev');
                const nextBtn = document.getElementById('history-next');
                if (prevBtn) prevBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    navigateHistory(-1);
                });
                if (nextBtn) nextBtn.addEventListener('click', (e) => {
                    e.preventDefault();
                    e.stopPropagation();
                    navigateHistory(1);
                });

                console.log('[LLM-RESPONSE] IPC listeners set up successfully');
            } else {
                console.error('[LLM-RESPONSE] electronAPI not available!');
            }
        } // end initLLMResponseWindow

        function applyInterviewHudPayload(payload, { clearHistory = false } = {}) {
            if (!payload || typeof payload !== 'object' || typeof payload.enabled !== 'boolean') {
                return;
            }
            setInterviewHud(payload.enabled, { clearHistory: clearHistory && payload.enabled === false });
        }

        function setInterviewHud(enabled, { clearHistory = false } = {}) {
            interviewHud = !!enabled;
            if (interviewHud) compactCard = true;
            document.body.classList.toggle('interview-card', interviewHud || compactCard);
            if (!interviewHud && clearHistory) {
                turnHistory = [];
                historyIndex = -1;
                viewingHistory = false;
                compactCard = false;
            }
            updateHistoryNav();
        }

        function setAskedQuestion(question) {
            currentQuestion = String(question || '').trim();
            const targets = [
                ['loading-question-block', 'loading-question-text'],
            ];
            targets.forEach(([blockId, textId]) => {
                const block = document.getElementById(blockId);
                const textEl = document.getElementById(textId);
                if (!block || !textEl) return;
                if (currentQuestion) {
                    textEl.textContent = currentQuestion;
                    block.classList.remove('hidden');
                } else {
                    textEl.textContent = '';
                    block.classList.add('hidden');
                }
            });
        }

        function askedQuestionHtml() {
            if (!currentQuestion) return '';
            const label = viewingHistory ? 'Earlier question' : 'Question';
            return `<div class="asked-question"><div class="asked-label">${label}</div><p>${escapeHtml(currentQuestion)}</p></div>`;
        }

        function useSingleColumn() {
            return interviewHud
                || compactCard
                || document.body.classList.contains('interview-card');
        }

        function snapshotCurrentTurn() {
            const response = String(currentResponse || liveStreamBuffer || '').trim();
            if (!response) return;
            rememberTurn(liveQuestion || currentQuestion, response);
        }

        function unfreezeAnswerCard() {
            answerCardFrozen = false;
        }

        function measureAnswerCardHeight() {
            const loading = document.getElementById('loading');
            if (loading && !loading.classList.contains('hidden')) {
                const block = document.getElementById('loading-question-block');
                const compact = loading.querySelector('.loading-compact');
                let height = 52;
                if (block && !block.classList.contains('hidden')) {
                    height += block.offsetHeight || block.scrollHeight || 0;
                }
                if (compact) {
                    height += compact.offsetHeight || 40;
                }
                return Math.max(280, Math.ceil(height + 16));
            }
            const markdown = document.getElementById('full-markdown');
            const inner = document.querySelector('#full-content .full-content-inner');
            if (markdown) {
                let pad = 52;
                if (inner) {
                    const styles = window.getComputedStyle(inner);
                    pad = (parseFloat(styles.paddingTop) || 0)
                        + (parseFloat(styles.paddingBottom) || 0);
                }
                return Math.max(280, Math.ceil(markdown.scrollHeight + pad + 8));
            }
            return 280;
        }

        function rememberTurn(question, response) {
            const q = String(question || '').trim();
            const r = String(response || '').trim();
            if (!r) return;
            const last = turnHistory[turnHistory.length - 1];
            if (last && last.question === q && last.response === r) {
                if (!viewingHistory) historyIndex = turnHistory.length - 1;
                updateHistoryNav();
                return;
            }
            if (last && last.question === q && r.startsWith(last.response)) {
                last.response = r;
                if (!viewingHistory) historyIndex = turnHistory.length - 1;
                updateHistoryNav();
                return;
            }
            turnHistory.push({ question: q, response: r });
            if (turnHistory.length > MAX_TURN_HISTORY) {
                turnHistory.shift();
                if (viewingHistory && historyIndex > 0) {
                    historyIndex -= 1;
                }
            }
            if (!viewingHistory) {
                historyIndex = turnHistory.length - 1;
            }
            updateHistoryNav();
        }

        function updateHistoryNav() {
            const nav = document.getElementById('history-nav');
            const pos = document.getElementById('history-pos');
            const prevBtn = document.getElementById('history-prev');
            const nextBtn = document.getElementById('history-next');
            if (!nav) return;
            const count = turnHistory.length;
            if (!useSingleColumn() || count === 0) {
                nav.classList.add('hidden');
                return;
            }
            nav.classList.remove('hidden');
            const index = viewingHistory
                ? historyIndex
                : Math.max(0, count - 1);
            if (pos) pos.textContent = `${index + 1}/${count}`;
            if (prevBtn) prevBtn.disabled = index <= 0;
            if (nextBtn) nextBtn.disabled = index >= count - 1;
        }

        function navigateHistory(direction) {
            if (turnHistory.length === 0) return;
            const current = viewingHistory ? historyIndex : turnHistory.length - 1;
            const next = current + direction;
            if (next < 0 || next >= turnHistory.length) return;
            viewingHistory = next < turnHistory.length - 1;
            historyIndex = next;
            unfreezeAnswerCard();
            hideLoadingState();
            const responseElement = document.getElementById('response-content');
            if (responseElement) responseElement.classList.remove('hidden');
            const followLive = !viewingHistory && liveStreamActive && liveStreamBuffer;
            if (followLive) {
                setAskedQuestion(liveQuestion || turnHistory[next].question);
                currentResponse = liveStreamBuffer;
                renderAnswer(liveStreamBuffer);
                requestInterviewResize({ force: true, fit: true });
            } else {
                const turn = turnHistory[next];
                setAskedQuestion(turn.question);
                currentResponse = turn.response;
                renderAnswer(turn.response);
                requestInterviewResize({ freeze: true, force: true, fit: true });
            }
            updateHistoryNav();
            setupScrolling();
        }

        function renderAnswer(response) {
            const codeBlocks = extractCodeBlocks(response);
            hasCode = codeBlocks.length > 0;
            displayFullLayout(response);
        }

        function requestInterviewResize(options = {}) {
            if (!useSingleColumn() || !window.electronAPI || !window.electronAPI.resizeInterviewCard) {
                return;
            }
            if ((viewingHistory || answerCardFrozen) && !options.force && !options.freeze) {
                return;
            }
            const freezeAfter = !!options.freeze;
            const run = () => {
                interviewResizeTimer = null;
                const contentHeight = measureAnswerCardHeight();
                window.electronAPI.resizeInterviewCard({
                    hasCode,
                    contentHeight,
                    frozen: freezeAfter,
                    fit: !!options.fit
                }).then(() => {
                    if (freezeAfter) answerCardFrozen = true;
                }).catch(() => {
                    if (freezeAfter) answerCardFrozen = true;
                });
            };
            if (interviewResizeTimer) {
                clearTimeout(interviewResizeTimer);
                interviewResizeTimer = null;
            }
            if (freezeAfter || options.immediate) {
                run();
                return;
            }
            interviewResizeTimer = setTimeout(run, 80);
        }

        function showLoadingState() {
            const loadingElement = document.getElementById('loading');
            const responseElement = document.getElementById('response-content');
            
            if (loadingElement) {
                loadingElement.classList.remove('hidden');
                loadingElement.style.display = ''; // Remove any forced display styles
            }
            
            if (responseElement) {
                responseElement.classList.add('hidden');
            }
            
            console.log('Loading state shown - should see Analyzing...');
        }

        function hideLoadingState() {
            const loadingElement = document.getElementById('loading');
            if (loadingElement) {
                loadingElement.classList.add('hidden');
                loadingElement.style.display = 'none'; // Force hide
                console.log('Loading state hidden');
            } else {
                console.error('Loading element not found!');
            }
        }

        function renderMarkdown(text) {
            if (typeof marked !== 'undefined') {
                return marked.parse ? marked.parse(text) : marked(text);
            }

            if (typeof markdown !== 'undefined' && typeof markdown.toHTML === 'function') {
                return markdown.toHTML(text);
            }

            return escapeHtml(text).replace(/\n/g, '<br>');
        }

        function calculateContentMetrics(response, codeBlocks) {
            // Count lines in the response
            const lineCount = response.split('\n').length;
            
            // Check for long lines (over 80 characters)
            const hasLongLines = response.split('\n').some(line => line.length > 80);
            
            // Count code blocks
            const codeBlockCount = codeBlocks.length;
            
            // Estimate content complexity
            const hasCode = codeBlockCount > 0;
            const isLongContent = lineCount > 30;
            const hasMultipleCodeBlocks = codeBlockCount > 2;
            
            return {
                lineCount,
                hasLongLines,
                codeBlocks: codeBlockCount,
                hasCode,
                isLongContent,
                hasMultipleCodeBlocks,
                complexity: isLongContent || hasMultipleCodeBlocks ? 'high' : hasCode ? 'medium' : 'low'
            };
        }

        function displayResponse(data) {
            // Show content
            const responseElement = document.getElementById('response-content');
            
            if (responseElement) {
                responseElement.classList.remove('hidden');
            }

            // Parse the response - check both content and response properties for compatibility
            const response = data.content || data.response;
            
            if (!response) {
                console.error('No response data received', {
                    dataKeys: Object.keys(data),
                    hasContent: !!data.content,
                    hasResponse: !!data.response
                });
                return;
            }
            
            currentResponse = response;
            liveQuestion = currentQuestion || liveQuestion;
            if (data && data.metadata && data.metadata.compactCard) {
                compactCard = true;
                setInterviewHud(true);
            }
            if (useSingleColumn()) {
                rememberTurn(currentQuestion, response);
            }
            liveStreamActive = false;
            if (viewingHistory || answerCardFrozen) {
                return;
            }
            const codeBlocks = extractCodeBlocks(response);
            const contentMetrics = calculateContentMetrics(response, codeBlocks);
            renderAnswer(response);

            if (useSingleColumn() || (data && data.metadata && data.metadata.compactCard)) {
                requestInterviewResize({ freeze: true });
                return;
            }
            if (window.electronAPI.getInterviewState) {
                window.electronAPI.getInterviewState().then((state) => {
                    if (state && state.enabled) return;
                    requestExpand(contentMetrics);
                }).catch(() => requestExpand(contentMetrics));
                return;
            }
            requestExpand(contentMetrics);
        }

        function requestExpand(contentMetrics) {
            setTimeout(() => {
                window.electronAPI.resizeLlmWindowForContent(contentMetrics)
                    .catch((error) => {
                        console.error('Failed to resize window:', error);
                    });
            }, 200);
        }

        function renderLiveStream(text) {
            currentResponse = text;
            if (useSingleColumn()) {
                rememberTurn(liveQuestion || currentQuestion, text);
            }
            if (viewingHistory || answerCardFrozen) {
                return;
            }
            renderAnswer(text);
            if (useSingleColumn()) {
                requestInterviewResize();
            }
        }

        function setupScrolling() {
            // Set up scrollable elements based on current layout
            setTimeout(() => {
                scrollableElements = [
                    document.querySelector('.full-content-inner')
                ].filter(el => el !== null);
                // Reset scroll positions and ensure elements are focusable
                scrollableElements.forEach(element => {
                    element.scrollTop = 0;
                    element.scrollLeft = 0;
                    element.setAttribute('tabindex', '0');
                });

                // Enable scrolling if interactive mode is on
                if (isInteractive) {
                    enableScrolling();
                }
            }, 100);
        }

        function enableScrolling() {
            scrollableElements.forEach(element => {
                if (element) {
                    // Enable mouse/trackpad scrolling with smooth behavior
                    element.style.scrollBehavior = 'smooth';
                    
                    // Add mouse enter handler to ensure focus for scrolling
                    element.addEventListener('mouseenter', handleMouseEnter, { passive: true });
                    element.addEventListener('mouseleave', handleMouseLeave, { passive: true });
                    
                    // Add wheel event for enhanced scrolling
                    element.addEventListener('wheel', handleWheelScroll, { passive: false });
                    
                }
            });
        }

        function disableScrolling() {
            scrollableElements.forEach(element => {
                if (element) {
                    element.removeEventListener('mouseenter', handleMouseEnter);
                    element.removeEventListener('mouseleave', handleMouseLeave);
                    element.removeEventListener('wheel', handleWheelScroll);
                }
            });
        }

        function handleMouseEnter(e) {
            // Focus the element for keyboard scrolling and ensure it's ready for mouse scrolling
            e.target.focus({ preventScroll: true });
            e.target.style.cursor = 'grab';
        }

        function handleMouseLeave(e) {
            e.target.style.cursor = 'default';
        }

        function handleWheelScroll(e) {
            // Allow natural scrolling behavior
            // Don't prevent default to maintain smooth native scrolling
            console.log('Wheel scroll detected on element');
        }

        function extractCodeBlocks(text) {
            const blocks = [];
            if (!text) return blocks;
            const regex = /(```|~~~)([^\n]*)\n([\s\S]*?)\1/g; // supports ```lang and ~~~lang
            let match;
            while ((match = regex.exec(text)) !== null) {
                const info = (match[2] || '').trim();
                const langToken = info.split(/\s+/)[0] || 'text';
                blocks.push({ language: langToken, code: match[3], fullMatch: match[0] });
            }
            return blocks;
        }

        function attachCopy(btn, text) {
            btn.addEventListener('click', async (e) => {
                e.stopPropagation();
                try {
                    let ok = false;
                    if (window.electronAPI && typeof window.electronAPI.copyToClipboard === 'function') {
                        ok = await window.electronAPI.copyToClipboard(text);
                    }
                    if (!ok) {
                        if (navigator.clipboard && navigator.clipboard.writeText) {
                            await navigator.clipboard.writeText(text);
                            ok = true;
                        } else {
                            const ta = document.createElement('textarea');
                            ta.value = text;
                            document.body.appendChild(ta);
                            ta.select();
                            document.execCommand('copy');
                            ta.remove();
                            ok = true;
                        }
                    }
                    if (ok) {
                        btn.classList.add('copied');
                        const original = btn.textContent;
                        btn.textContent = 'Copied';
                        setTimeout(() => { btn.classList.remove('copied'); btn.textContent = original || 'Copy'; }, 1200);
                    }
                } catch (err) { console.warn('Copy failed', err); }
            })
        }

        function renderCopyButtonsInFullMarkdown(container) {
            // Add copy buttons to all code blocks in full markdown view
            const pres = container.querySelectorAll('pre');
            pres.forEach(pre => {
                // Avoid duplicate buttons
                if (pre.querySelector('.copy-btn')) return;
                const code = pre.querySelector('code');
                const text = code ? code.textContent : pre.textContent;
                const btn = document.createElement('button');
                btn.className = 'copy-btn';
                btn.textContent = 'Copy';
                attachCopy(btn, text || '');
                pre.style.position = 'relative';
                pre.appendChild(btn);
            });
        }

        function displaySplitLayout(response, codeBlocks) {
            // Show split layout, hide full layout
            document.getElementById('split-layout').classList.remove('hidden');
            document.getElementById('full-content').classList.add('hidden');

            // Remove code blocks from text content
            let textContent = response;
            codeBlocks.forEach(block => {
                textContent = textContent.replace(block.fullMatch, '');
            });

            // Clean up text content
            textContent = textContent.replace(/\n\s*\n\s*\n/g, '\n\n').trim();

            // Render text content
            const textHtml = askedQuestionHtml() + renderMarkdown(textContent);
            document.getElementById('text-content').innerHTML = textHtml;
            if (window.renderMathInElement) window.renderMathInElement(document.getElementById('text-content'));

            // Render code blocks
            const codeContainer = document.getElementById('code-content');
            codeContainer.innerHTML = '';

            if (codeBlocks.length === 0) {
                codeContainer.innerHTML = '<div class="no-code">No code examples found</div>';
            } else {
                codeBlocks.forEach((block, index) => {
                    const codeBlock = document.createElement('div');
                    codeBlock.className = 'code-block';
                    codeBlock.innerHTML = `
                        <div class="code-header">${block.language.toUpperCase()}</div>
                        <div class="code-content">
                            <pre><code class="language-${block.language}">${escapeHtml(block.code)}</code></pre>
                        </div>
                    `;
                    const pre = codeBlock.querySelector('pre');
                    pre.style.position = 'relative';
                    const btn = document.createElement('button');
                    btn.className = 'copy-btn';
                    btn.textContent = 'Copy';
                    attachCopy(btn, block.code || '');
                    pre.appendChild(btn);

                    codeContainer.appendChild(codeBlock);
                });
            }

            // Highlight code if Prism is available
            if (typeof Prism !== 'undefined') {
                Prism.highlightAll();
            }
        }

        function displayFullLayout(response) {
            // Show full layout, hide split layout
            document.getElementById('split-layout').classList.add('hidden');
            document.getElementById('full-content').classList.remove('hidden');

            // Render full markdown
            const html = askedQuestionHtml() + renderMarkdown(response || '');
            const full = document.getElementById('full-markdown');
            full.innerHTML = html;
            if (window.renderMathInElement) window.renderMathInElement(full);

            // Highlight any code if Prism is available
            if (typeof Prism !== 'undefined') {
                Prism.highlightAll();
            }

            // Add copy buttons to code blocks in full view
            const pres = full.querySelectorAll('pre');
            pres.forEach(pre => {
                if (pre.querySelector('.copy-btn')) return;
                const code = pre.querySelector('code');
                const text = code ? code.textContent : pre.textContent;
                const btn = document.createElement('button');
                btn.className = 'copy-btn';
                btn.textContent = 'Copy';
                attachCopy(btn, text || '');
                pre.style.position = 'relative';
                pre.appendChild(btn);
            });
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }


        // Handle window focus
        window.addEventListener('focus', () => {
            console.log('LLM Response window focused');
        });

        // Handle window close
        window.addEventListener('beforeunload', () => {
            console.log('LLM Response window closing');
        });

        // Add keyboard scrolling support for when interactive
        document.addEventListener('keydown', (e) => {
            if (e.altKey && (e.key === 'ArrowLeft' || e.key === 'Left')) {
                e.preventDefault();
                navigateHistory(-1);
                return;
            }
            if (e.altKey && (e.key === 'ArrowRight' || e.key === 'Right')) {
                e.preventDefault();
                navigateHistory(1);
                return;
            }
            if (!isInteractive) return;
            
            const activeElement = document.activeElement;
            let targetElement = null;
            
            // Find the currently focused scrollable element
            for (let element of scrollableElements) {
                if (element === activeElement || element.contains(activeElement)) {
                    targetElement = element;
                    break;
                }
            }
            
            // Default to first scrollable element if none focused
            if (!targetElement && scrollableElements.length > 0) {
                targetElement = scrollableElements[0];
            }
            
            if (!targetElement) return;
            
            const scrollAmount = 50; // Pixels to scroll
            
            switch(e.key) {
                case 'ArrowUp':
                    e.preventDefault();
                    targetElement.scrollBy({ top: -scrollAmount, behavior: 'smooth' });
                    break;
                case 'ArrowDown':
                    e.preventDefault();
                    targetElement.scrollBy({ top: scrollAmount, behavior: 'smooth' });
                    break;
                case 'ArrowLeft':
                    e.preventDefault();
                    targetElement.scrollBy({ left: -scrollAmount, behavior: 'smooth' });
                    break;
                case 'ArrowRight':
                    e.preventDefault();
                    targetElement.scrollBy({ left: scrollAmount, behavior: 'smooth' });
                    break;
                case 'PageUp':
                    e.preventDefault();
                    targetElement.scrollBy({ top: -targetElement.clientHeight * 0.8, behavior: 'smooth' });
                    break;
                case 'PageDown':
                    e.preventDefault();
                    targetElement.scrollBy({ top: targetElement.clientHeight * 0.8, behavior: 'smooth' });
                    break;
                case 'Home':
                    e.preventDefault();
                    targetElement.scrollTo({ top: 0, behavior: 'smooth' });
                    break;
                case 'End':
                    e.preventDefault();
                    targetElement.scrollTo({ top: targetElement.scrollHeight, behavior: 'smooth' });
                    break;
            }
        });

        // Add verification function to ensure content is properly displayed
        function verifyDisplayState() {
            const loadingElement = document.getElementById('loading');
            const responseElement = document.getElementById('response-content');
            
            const isLoadingHidden = loadingElement ? loadingElement.classList.contains('hidden') : true;
            const isContentVisible = responseElement ? !responseElement.classList.contains('hidden') : false;
            
            console.log('Display state verification:', {
                loadingHidden: isLoadingHidden,
                contentVisible: isContentVisible,
                windowVisible: !document.hidden
            });
            
            if (!isLoadingHidden || !isContentVisible) {
                console.warn('Display state inconsistent - forcing correction');
                if (loadingElement) {
                    loadingElement.classList.add('hidden');
                    loadingElement.style.display = 'none';
                }
                if (responseElement) {
                    responseElement.classList.remove('hidden');
                }
            }
        }

        // Add global debugging function
        window.debugLLMWindow = function() {
            console.log('=== LLM Window Debug Info ===');
            console.log('Current layout:', currentLayout);
            console.log('Has code:', hasCode);
            console.log('Is interactive:', isInteractive);
            console.log('Scrollable elements:', scrollableElements.length);
            
            const loadingElement = document.getElementById('loading');
            const responseElement = document.getElementById('response-content');
        };

        // Close button handler
        (function(){
            const btn = document.getElementById('close-window-btn');
            if (btn) {
                btn.addEventListener('click', () => {
                    try {
                        if (window.electronAPI && window.electronAPI.closeWindow) {
                            window.electronAPI.closeWindow();
                        } else if (window.api && window.api.send) {
                            window.api.send('quit-app');
                        } else {
                            window.close();
                        }
                    } catch (e) {
                        try { window.close(); } catch (_) {}
                    }
                });
            }
        })();
    </script>
