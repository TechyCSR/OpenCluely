<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>OpenCluely v2 Ghost HUD</title>
  <style>
    :root {
      --bg-glass: rgba(18, 18, 22, 0.88);
      --border-glass: rgba(255, 255, 255, 0.12);
      --accent: #6366f1;
      --accent-glow: rgba(99, 102, 241, 0.35);
      --text: #f3f4f6;
      --text-muted: #9ca3af;
      --font: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
    }

    body {
      background: transparent;
      color: var(--text);
      font-family: var(--font);
      font-size: 13px;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    /* ── Floating Command Bar ── */
    .command-bar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass);
      border-radius: 9999px;
      padding: 4px 12px;
      height: 38px;
      box-shadow: 0 8px 32px rgba(0, 0, 0, 0.3);
      cursor: grab;
      -webkit-app-region: drag;
    }

    .command-bar:active {
      cursor: grabbing;
    }

    .status-group {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 8px #10b981;
      animation: pulse 2s infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }

    .brand {
      font-weight: 600;
      letter-spacing: 0.5px;
      font-size: 12px;
      color: #fff;
    }

    /* ── Custom In-Canvas Skill Switcher (No OS Select Elements) ── */
    .skills-pills {
      display: flex;
      align-items: center;
      gap: 4px;
      -webkit-app-region: no-drag;
    }

    .skill-btn {
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-muted);
      padding: 3px 8px;
      border-radius: 6px;
      font-size: 11px;
      cursor: pointer;
      transition: all 0.15s ease;
    }

    .skill-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.08);
    }

    .skill-btn.active {
      background: var(--accent);
      color: #fff;
      font-weight: 500;
      box-shadow: 0 0 12px var(--accent-glow);
    }

    /* ── Controls Group ── */
    .controls {
      display: flex;
      align-items: center;
      gap: 6px;
      -webkit-app-region: no-drag;
    }

    .icon-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      cursor: pointer;
      padding: 4px;
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .icon-btn:hover {
      color: #fff;
      background: rgba(255, 255, 255, 0.1);
    }

    /* ── Response Card HUD ── */
    .response-card {
      background: var(--bg-glass);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid var(--border-glass);
      border-radius: 12px;
      padding: 14px;
      flex: 1;
      display: flex;
      flex-direction: column;
      overflow: hidden;
      box-shadow: 0 12px 40px rgba(0, 0, 0, 0.4);
    }

    .response-content {
      overflow-y: auto;
      flex: 1;
      font-size: 13px;
      line-height: 1.6;
      color: #e5e7eb;
      user-select: text;
    }

    .response-content pre {
      background: rgba(0, 0, 0, 0.5);
      border: 1px solid rgba(255, 255, 255, 0.08);
      border-radius: 8px;
      padding: 10px;
      margin: 8px 0;
      overflow-x: auto;
      font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
      font-size: 12px;
    }
  </style>
</head>
<body>
  <!-- Drag-able Ghost Command Bar -->
  <div class="command-bar" id="commandBar">
    <div class="status-group">
      <div class="status-dot" id="statusDot"></div>
      <span class="brand">OPENCLUELY v2</span>
    </div>

    <!-- Custom In-Canvas Skill Switcher -->
    <div class="skills-pills">
      <button class="skill-btn active" data-skill="dsa">DSA</button>
      <button class="skill-btn" data-skill="system_design">System Design</button>
      <button class="skill-btn" data-skill="sql">SQL / Data</button>
      <button class="skill-btn" data-skill="quiz">MCQ Speed</button>
      <button class="skill-btn" data-skill="behavioral">STAR Behavioral</button>
    </div>

    <!-- Quick Shortcuts & Panic -->
    <div class="controls">
      <button class="icon-btn" id="panicBtn" title="Instant Panic Killswitch (Ctrl+Alt+Q)">⚡</button>
      <button class="icon-btn" id="clickthroughBtn" title="Toggle Click-Through (Alt+A)">👁️</button>
    </div>
  </div>

  <!-- Real-Time Streaming HUD Response -->
  <div class="response-card" id="responseCard">
    <div class="response-content" id="responseContent">
      <p style="color: var(--text-muted); font-style: italic;">Ready. Listening to audio loopback and waiting for snip shortcut (Ctrl+Shift+S)...</p>
    </div>
  </div>

  <script>
    // Tab switching logic (pure in-canvas DOM)
    document.querySelectorAll('.skill-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.skill-btn').forEach(b => b.classList.remove('active'));
        btn.classList.add('active');
      });
    });
  </script>
</body>
</html>
